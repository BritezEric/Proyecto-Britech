# Orquesta los 2 contenedores de Britech: la app (PHP+Apache) y la base (MySQL).
# Se levanta todo con: docker compose up

services:
  # --- Contenedor de la aplicacion (PHP + Apache) ---
  app:
    build: .                       # construye la imagen usando el Dockerfile
    ports:
      - "8080:80"                  # http://localhost:8080  ->  Apache del contenedor
    volumes:
      - .:/var/www/html            # monta el proyecto dentro del contenedor
    environment:                   # credenciales de la base (sobrescriben al .env)
      DB_HOST: db                  # "db" = el nombre del otro contenedor
      DB_PORT: "3306"
      DB_NAME: britech_v2
      DB_USER: root
      DB_PASS: britech
      DB_CHARSET: utf8mb4
      # Asistente de voz / n8n: se leen de un archivo .env junto a este compose.
      VOZ_API_KEY: ${VOZ_API_KEY:-}
      VOZ_USUARIO_ID: ${VOZ_USUARIO_ID:-1}
    depends_on:
      - db                         # espera a que arranque la base

  # --- Contenedor de la base de datos (MySQL) ---
  db:
    image: mysql:8.4               # imagen oficial de MySQL, ya lista
    ports:
      - "127.0.0.1:3307:3306"      # solo accesible desde el propio server (no expuesto a internet)
    environment:
      MYSQL_ROOT_PASSWORD: britech
      MYSQL_DATABASE: britech_v2
    volumes:
      - db_data:/var/lib/mysql                       # guarda los datos (persisten)
      - ./database:/docker-entrypoint-initdb.d       # importa el schema al crear la base

  # --- n8n (automatizacion del asistente de voz) ---
  # Guarda sus propios flujos en SQLite dentro del volumen n8n_data (no toca la
  # base de Britech). Llega a la API de Britech por la red interna: http://app
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"      # solo local: se accede por tunel SSH (no expuesto a internet)
    environment:
      - N8N_SECURE_COOKIE=false    # permite abrir la UI por http durante el armado
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - n8n_data:/home/node/.n8n

# Volumenes con nombre: los datos persisten aunque se apaguen los contenedores.
volumes:
  db_data:
  n8n_data:
