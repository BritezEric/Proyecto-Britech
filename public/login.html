<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britech — Ingresar</title>
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
    <main class="login-caja">
        <h1 class="login-logo">Britech</h1>
        <p class="login-sub">Ingresá para continuar</p>

        <form id="form-login">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="username" autofocus>

            <label for="password">Contraseña</label>
            <input id="password" type="password" required autocomplete="current-password">

            <p id="login-error" class="login-error oculto"></p>
            <button type="submit">Ingresar</button>
        </form>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/login.js"></script>
</body>
</html>
