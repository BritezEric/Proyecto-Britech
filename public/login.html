<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britech — Ingresar</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
    <main class="login-caja">
        <h1 class="login-logo brand-lockup">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-sq" width="32" height="32" rx="8"/><path class="brand-play" d="M12 8.5L24 16L12 23.5Z"/></svg>
            <span class="brand-word">Britech</span></h1>
        <p class="login-sub">Acceso del equipo (admin y vendedores)</p>

        <form id="form-login">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="username" autofocus>

            <label for="password">Contraseña</label>
            <input id="password" type="password" required autocomplete="current-password">

            <p id="login-error" class="login-error oculto"></p>
            <button type="submit">Ingresar</button>
        </form>

        <div class="login-sep"><span>o</span></div>
        <a href="/api/staff/auth0/login" class="btn-google">
            <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
            Continuar con Google
        </a>

        <p class="login-link-fila"><a class="login-link" href="/olvide.html">¿Olvidaste tu contraseña?</a></p>

        <div class="login-sep"><span>¿Sos cliente?</span></div>
        <a class="login-registro" href="/tienda.html?registro=1">Crear cuenta en la tienda →</a>
        <p class="login-link-fila"><a class="login-link" href="/tienda.html">Ver la tienda sin cuenta</a></p>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/login.js"></script>
</body>
</html>
