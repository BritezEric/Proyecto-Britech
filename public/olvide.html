<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britech — Recuperar contraseña</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
    <main class="login-caja">
        <div class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
        </div>
        <h1 class="login-logo brand-lockup">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-sq" width="32" height="32" rx="8"/><path class="brand-play" d="M12 8.5L24 16L12 23.5Z"/></svg>
            <span class="brand-word">Britech</span></h1>
        <p class="login-sub">Ingresá tu email y te enviamos un enlace para crear una nueva contraseña.</p>

        <form id="form-olvide">
            <label for="email">Email</label>
            <input id="email" type="email" required autofocus>
            <p id="msg-ok" class="login-ok oculto"></p>
            <button type="submit">Enviar enlace</button>
        </form>

        <p class="volver"><a href="/login.html">← Volver a ingresar</a></p>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/olvide.js"></script>
</body>
</html>
