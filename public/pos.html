<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britech — Punto de Venta</title>
    <link rel="stylesheet" href="/assets/css/pos.css">
</head>
<body>
    <header class="barra">
        <span class="logo">Britech · POS</span>
        <div class="barra-derecha">
            <span class="vendedor">Vendedor: <span id="vendedor-nombre">…</span></span>
            <a id="link-usuarios" class="btn-logout oculto" href="/usuarios.html">Usuarios</a>
            <button id="btn-logout" class="btn-logout">Salir</button>
        </div>
    </header>

    <main class="pos">
        <!-- IZQUIERDA: buscar / escanear productos -->
        <section class="panel panel-productos">
            <label for="busqueda" class="etiqueta">Buscar o escanear producto</label>
            <input id="busqueda" class="buscador" type="text"
                   placeholder="Escaneá el código, o escribí nombre / SKU…"
                   autocomplete="off" autofocus>
            <div id="resultados" class="resultados">
                <p class="vacio">Escribí o escaneá para buscar un producto.</p>
            </div>
        </section>

        <!-- DERECHA: la venta -->
        <aside class="panel panel-venta">
            <div class="venta-cliente">
                <label for="cliente" class="etiqueta">Cliente</label>
                <select id="cliente" class="select-cliente"></select>
            </div>
            <div id="carrito" class="carrito">
                <p class="vacio-carrito">Carrito vacío.<br>Buscá o escaneá un producto para agregarlo.</p>
            </div>

            <div class="venta-resumen">
                <div class="fila-resumen"><span>Subtotal</span><span id="subtotal">$ 0,00</span></div>
                <div class="fila-resumen">
                    <label for="desc-total">Descuento</label>
                    <input id="desc-total" class="input-desc" type="number" min="0" step="0.01" value="0">
                </div>
                <div class="fila-resumen total"><span>Total</span><span id="total">$ 0,00</span></div>
            </div>

            <button id="btn-cobrar" class="btn-cobrar" disabled>Cobrar</button>
        </aside>
    </main>

    <!-- MODAL DE COBRO -->
    <div id="modal-cobro" class="modal oculto">
        <div class="modal-caja">
            <h2>Cobro</h2>
            <div class="cobro-total"><span>Total a cobrar</span><strong id="cobro-total">$ 0,00</strong></div>

            <label class="etiqueta">Medios de pago</label>
            <div id="pagos-lista" class="pagos-lista"></div>
            <button id="btn-agregar-pago" class="btn-link" type="button">+ Agregar medio de pago</button>

            <div class="cobro-estado">
                <div><span>Pagado</span><span id="pagado">$ 0,00</span></div>
                <div><span id="falta-label">Falta</span><span id="falta">$ 0,00</span></div>
            </div>

            <p id="cobro-error" class="cobro-error oculto"></p>
            <div class="modal-botones">
                <button id="btn-cancelar" class="btn-secundario">Cancelar</button>
                <button id="btn-confirmar" class="btn-cobrar" disabled>Confirmar venta</button>
            </div>
        </div>
    </div>

    <!-- TICKET -->
    <div id="modal-ticket" class="modal oculto">
        <div class="modal-caja">
            <div id="ticket" class="ticket"></div>
            <div class="modal-botones no-imprimir">
                <button id="btn-imprimir" class="btn-secundario">Imprimir</button>
                <button id="btn-nueva-venta" class="btn-cobrar">Nueva venta</button>
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/pos.js"></script>
</body>
</html>
