<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britech — Ventas</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/pos.css">
    <style>
        body { min-height: 100vh; overflow: auto; }
        .ventas-wrap { max-width: 940px; margin: 0 auto; padding: var(--sp-6) var(--sp-4); }
        .ventas-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--sp-5); }
        .ventas-top h1 { margin: 0; font-size: var(--text-2xl); font-weight: 800; letter-spacing: -0.03em; }
        .ventas-top p { margin: var(--sp-1) 0 0; color: var(--ink-muted); font-size: var(--text-sm); }
        .volver-link { color: var(--primary-strong); text-decoration: none; font-weight: 600; font-size: var(--text-sm); }
        .volver-link:hover { text-decoration: underline; }

        .tabla-caja {
            background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--ink-muted); text-align: left; padding: var(--sp-3) var(--sp-4);
            background: var(--surface-2); border-bottom: 1px solid var(--line);
        }
        tbody td { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr { transition: background var(--dur-fast) var(--ease-out); }
        tbody tr:hover { background: var(--surface-2); }
        td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
        .num-venta { font-weight: 700; color: var(--ink); white-space: nowrap; }
        .fecha { color: var(--ink-muted); white-space: nowrap; }

        .estado {
            font-size: var(--text-xs); font-weight: 600; padding: 2px var(--sp-2); border-radius: var(--r-full);
            display: inline-flex; align-items: center; gap: 5px;
        }
        .estado::before { content: ""; width: 6px; height: 6px; border-radius: var(--r-full); background: currentColor; }
        .estado.registrada { background: var(--primary-tint); color: var(--primary-strong); }
        .estado.anulada { background: var(--danger-tint); color: var(--danger-strong); }

        .btn-anular {
            border: 1.5px solid var(--line-strong); color: var(--danger-strong); background: var(--surface);
            border-radius: var(--r-sm); padding: var(--sp-1) var(--sp-3); cursor: pointer;
            font-size: var(--text-sm); font-weight: 600; font-family: inherit;
            transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
        }
        .btn-anular:hover { background: var(--danger-tint); border-color: var(--danger); }
        .btn-anular:disabled { opacity: 0.5; cursor: not-allowed; }

        .msg { margin: 0 0 var(--sp-4); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); font-size: var(--text-sm); font-weight: 600; }
        .msg.ok { background: var(--primary-tint); color: var(--primary-strong); }
        .msg.error { background: var(--danger-tint); color: var(--danger-strong); }

        tbody tr.clickable { cursor: pointer; }
        .modal-overlay { position: fixed; inset: 0; background: oklch(0.13 0 0 / 0.45); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: var(--sp-4); z-index: var(--z-modal); animation: fade-in var(--dur) var(--ease-out) both; }
        .modal-card { animation: caja-in var(--dur-slow) var(--ease-out) both; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 460px; max-height: 85vh; overflow: auto; }
        .modal-head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-4) var(--sp-3); border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
        .modal-head h2 { margin: 0; font-size: var(--text-lg); font-weight: 800; }
        .modal-x { border: none; background: none; cursor: pointer; font-size: 1.1rem; color: var(--ink-muted); padding: 2px 8px; border-radius: var(--r-sm); line-height: 1; }
        .modal-x:hover { background: var(--surface-2); color: var(--ink); }
        .det-body { padding: var(--sp-4); }
        .det-meta { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); margin-bottom: var(--sp-4); font-size: var(--text-sm); color: var(--ink-muted); }
        .det-meta b { color: var(--ink); font-weight: 700; }
        .det-items { width: 100%; border-collapse: collapse; }
        .det-items td { padding: var(--sp-2) 0; border-bottom: 1px solid var(--line); font-size: var(--text-sm); }
        .det-items td.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .det-sum { margin-top: var(--sp-3); font-size: var(--text-sm); }
        .det-sum .row { display: flex; justify-content: space-between; padding: 2px 0; color: var(--ink-muted); }
        .det-sum .row.total { color: var(--ink); font-weight: 800; font-size: var(--text-lg); margin-top: var(--sp-2); padding-top: var(--sp-2); border-top: 1px solid var(--line); }
    </style>
</head>
<body>
    <div class="ventas-wrap">
        <div class="ventas-top">
            <div>
                <h1>Ventas</h1>
                <p>Historial reciente · anulá una venta si hace falta (reintegra el stock).</p>
            </div>
            <a class="volver-link" href="/pos.html">← Volver al POS</a>
        </div>

        <p id="msg" class="msg oculto"></p>

        <div class="tabla-caja">
            <table>
                <thead>
                    <tr>
                        <th>Número</th><th>Cliente</th><th>Vendedor</th>
                        <th class="num">Total</th><th>Fecha</th><th>Estado</th><th></th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="7">Cargando…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modal-det" class="modal-overlay oculto">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="det-titulo">
            <div class="modal-head">
                <h2 id="det-titulo">Venta</h2>
                <button id="det-cerrar" class="modal-x" aria-label="Cerrar">✕</button>
            </div>
            <div id="det-cont" class="det-body"></div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/ventas.js"></script>
</body>
</html>
