<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britech — Nueva contraseña</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
    <main class="login-caja">
        <div class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
        </div>
        <h1 class="login-logo brand-lockup">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-sq" width="32" height="32" rx="8"/><path class="brand-play" d="M12 8.5L24 16L12 23.5Z"/></svg>
            <span class="brand-word">Britech</span></h1>
        <p class="login-sub">Elegí una nueva contraseña para tu cuenta.</p>

        <form id="form-restablecer" novalidate>
            <label for="password">Nueva contraseña</label>
            <div class="pw-campo">
                <input id="password" type="password" required autocomplete="new-password" minlength="8" autofocus>
                <button type="button" class="pw-ojo" data-ver="password" aria-label="Mostrar contraseña">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><line class="ojo-tacha" x1="3" y1="3" x2="21" y2="21"/></svg>
                </button>
            </div>
            <p class="login-hint" id="pw-hint">Mínimo 8 caracteres.</p>

            <label for="password2">Repetir contraseña</label>
            <div class="pw-campo">
                <input id="password2" type="password" required autocomplete="new-password">
                <button type="button" class="pw-ojo" data-ver="password2" aria-label="Mostrar contraseña">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><line class="ojo-tacha" x1="3" y1="3" x2="21" y2="21"/></svg>
                </button>
            </div>

            <p id="msg-error" class="login-error oculto"></p>
            <p id="msg-ok" class="login-ok oculto"></p>
            <button type="submit">Guardar contraseña</button>
        </form>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/pw-form.js"></script>
    <script src="/assets/js/restablecer.js"></script>
</body>
</html>
