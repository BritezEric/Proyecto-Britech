<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britech — Activar cuenta</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
    <main class="login-caja">
        <div class="auth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7.5l8 5.5 8-5.5"/></svg>
        </div>
        <h1 class="login-logo brand-lockup">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-sq" width="32" height="32" rx="8"/><path class="brand-play" d="M12 8.5L24 16L12 23.5Z"/></svg>
            <span class="brand-word">Britech</span></h1>
        <p class="login-sub">Activá tu cuenta y creá tu contraseña para comprar.</p>

        <form id="form-activar">
            <label for="password">Contraseña (mín. 6)</label>
            <input id="password" type="password" required autocomplete="new-password" autofocus>

            <label for="password2">Repetir contraseña</label>
            <input id="password2" type="password" required autocomplete="new-password">

            <p id="msg-error" class="login-error oculto"></p>
            <p id="msg-ok" class="login-ok oculto"></p>
            <button type="submit">Activar cuenta</button>
        </form>

        <p class="volver"><a href="/tienda.html">← Ir a la tienda</a></p>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/tienda-activar.js"></script>
</body>
</html>
