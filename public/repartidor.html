<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Britech — Repartidor</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <style>
        body { min-height: 100dvh; display: flex; flex-direction: column; }
        header { padding: calc(var(--sp-4) + env(safe-area-inset-top)) var(--sp-5) var(--sp-4); display: flex; align-items: center; gap: var(--sp-2); }
        header img { height: 26px; width: auto; }
        header b { font-size: var(--text-lg); letter-spacing: -0.02em; }
        header span { color: var(--ink-muted); font-size: var(--text-sm); }
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: var(--sp-5); padding: var(--sp-5); text-align: center; }
        .rep-nombre { font-size: var(--text-xl); font-weight: 800; letter-spacing: -0.02em; }
        .rep-sub { color: var(--ink-muted); margin: var(--sp-1) 0 0; font-size: var(--text-sm); }
        .estado { display: inline-flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); border-radius: var(--r-full);
            background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); font-size: var(--text-sm); font-weight: 600; }
        .dot { width: 10px; height: 10px; border-radius: var(--r-full); background: var(--ink-muted); }
        .estado.on .dot { background: var(--ok); animation: pulse 1.8s var(--ease-out) infinite; }
        @keyframes pulse { from { box-shadow: 0 0 0 0 oklch(0.60 0.15 155 / 0.55); } to { box-shadow: 0 0 0 10px oklch(0.60 0.15 155 / 0); } }
        .btn { width: min(340px, 86vw); border: none; border-radius: var(--r-md); padding: var(--sp-4) var(--sp-5); font-size: var(--text-lg); font-weight: 700;
            color: var(--on-primary); cursor: pointer; font-family: inherit; box-shadow: var(--shadow-md); }
        .btn:hover { transform: translateY(-1px); }
        .btn-on { background: var(--primary); }
        .btn-on:hover { background: var(--primary-strong); }
        .btn-off { background: var(--surface-2); color: var(--ink); }
        .info { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: var(--sp-4);
            width: min(340px, 86vw); font-size: var(--text-sm); color: var(--ink-muted); display: grid; gap: var(--sp-2); text-align: left; }
        .info b { color: var(--ink); }
        .err { color: var(--danger-strong); font-size: var(--text-sm); max-width: 340px; margin: 0; }
        footer { padding: var(--sp-4); text-align: center; color: var(--ink-muted); font-size: var(--text-xs); }
    </style>
</head>
<body>
    <header>
        <img src="/assets/img/britech-mark-blanco.png" alt="">
        <div><b>Britech</b> <span>Repartidor</span></div>
    </header>

    <main class="pagina-simple">
        <div>
            <div class="rep-nombre" id="rep-nombre">…</div>
            <p class="rep-sub">Compartí tu ubicación mientras repartís.</p>
        </div>

        <div class="estado" id="estado"><span class="dot"></span><span id="estado-txt">Desconectado</span></div>

        <button class="btn btn-on" id="btn-toggle">▶ Ponerme en línea</button>

        <div class="info">
            <div>Última posición: <b id="i-pos">—</b></div>
            <div>Precisión: <b id="i-prec">—</b></div>
            <div>Enviadas: <b id="i-count">0</b></div>
        </div>

        <p class="err" id="err"></p>
    </main>

    <footer>Mantené esta pantalla abierta mientras hacés el reparto.</footer>

    <script>
        const q = new URLSearchParams(location.search);
        const token = q.get('token') || '';
        const $ = (id) => document.getElementById(id);
        let watchId = null, enviadas = 0, ultimoEnvio = 0;

        if (!token) {
            $('err').textContent = 'Falta el token. Pedí tu link de seguimiento al administrador.';
            $('btn-toggle').disabled = true;
        }
        $('rep-nombre').textContent = token ? 'Repartidor' : 'Sin token';

        function setEstado(on) {
            $('estado').classList.toggle('on', on);
            $('estado-txt').textContent = on ? 'En línea' : 'Desconectado';
            $('btn-toggle').textContent = on ? '⏹ Ponerme fuera de línea' : '▶ Ponerme en línea';
            $('btn-toggle').className = 'btn ' + (on ? 'btn-off' : 'btn-on');
        }

        async function enviar(lat, lng) {
            try {
                const r = await fetch('/api/repartidor/posicion', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, lat, lng }),
                });
                const d = await r.json();
                if (!d.ok) { $('err').textContent = d.error || 'Error al enviar.'; return; }
                enviadas++; $('i-count').textContent = enviadas;
                $('i-pos').textContent = lat.toFixed(5) + ', ' + lng.toFixed(5);
                $('err').textContent = '';
            } catch (e) { $('err').textContent = 'Sin conexión. Reintentando…'; }
        }

        function onPos(p) {
            $('i-prec').textContent = Math.round(p.coords.accuracy) + ' m';
            const ahora = Date.now();
            if (ahora - ultimoEnvio < 4000) return;   // throttle: 1 envío cada ~4s
            ultimoEnvio = ahora;
            enviar(p.coords.latitude, p.coords.longitude);
        }
        function onErr(e) {
            $('err').textContent = e.code === 1
                ? 'Permiso de ubicación denegado. Activalo para compartir tu posición.'
                : 'No se pudo obtener el GPS.';
        }

        $('btn-toggle').addEventListener('click', () => {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId); watchId = null; setEstado(false); return;
            }
            if (!navigator.geolocation) { $('err').textContent = 'Este dispositivo no tiene GPS.'; return; }
            watchId = navigator.geolocation.watchPosition(onPos, onErr, {
                enableHighAccuracy: true, maximumAge: 2000, timeout: 10000,
            });
            setEstado(true);
            $('err').textContent = '';
        });
    </script>
</body>
</html>
